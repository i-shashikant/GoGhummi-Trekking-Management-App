{% extends "base.html" %}
{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Trek</h2>

    <form method="POST" action="{{ url_for('admin.edit_trek', trek_id=trek.id) }}">

        <div class="mb-3">
            <label for="name" class="form-label">Trek Name</label>
            <input type="text" class="form-control" id="name" name="trek_name" value="{{ trek.trek_name }}" required>

            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ trek.location }}" required>

            <label for="difficulty" class="form-label">Difficulty</label>
            <select class="form-select" name="difficulty" required>
                <option value="Easy" {% if trek.difficulty == "Easy" %}selected{% endif %}>Easy</option>
                <option value="Medium" {% if trek.difficulty == "Medium" %}selected{% endif %}>Medium</option>
                <option value="Hard" {% if trek.difficulty == "Hard" %}selected{% endif %}>Hard</option>
            </select>

            <label for="start_date" class="form-label">Start Date</label>
            <input type="date" class="form-control" id="start_dates" name="start_date" value="{{ trek.start_date }}" required>

            <label for="end_date" class="form-label">End Date</label>
            <input type="date" class="form-control" id="end_dates" name="end_date" value="{{ trek.end_date }}" required>

            <label for="duration" class="form-label">Duration (in hours)</label>
            <input type="number" class="form-control" id="duration" name="duration" min="1" value="{{ trek.duration }}" required>

            <label for="max_slots" class="form-label">Maximum Slots</label>
            <input type="number" class="form-control" id="max_slots" name="max_slots" min="1" value="{{ trek.max_slots }}" required>

            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required>{{ trek.description }}</textarea>


            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status" required>
                <option value="Open" {% if trek.status == "Open" %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == "Closed" %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == "Completed" %}selected{% endif %}>Completed</option>
            </select>

            <label for="assigned_staff" class="form-label">Assigned Staff</label>
            <select class="form-select" name="assigned_staff_id" id="assigned_staff">
                {% for staff in approved_staff %}
                    <option value="{{ staff.id }}"
                        {% if staff.id == trek.assigned_staff_id %}selected{% endif %}>
                        {{ staff.username }}
                    </option>
                {% endfor %}
            </select>

        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Update Trek</button>
            <a href="{{ url_for('admin.view_treks') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>


    </form>


</div>

{% endblock %}
