{% extends "base.html" %}
{% block title %}Login | TrekManager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-trek p-4">
            <h3 class="text-center mb-4"><i class="fa-solid fa-right-to-bracket"></i> Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-trek w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
