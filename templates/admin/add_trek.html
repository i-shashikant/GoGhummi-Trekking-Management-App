{% extends "base.html" %}
{% import "admin/_nav.html" as nav %}
{% block title %}Add Trek | TrekManager{% endblock %}
{% block navlinks %}{{ nav.admin_navlinks() }}{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fa-solid fa-plus"></i> Add New Trek</h2>
<div class="card card-trek p-4">
<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Difficulty</label>
            <select name="difficulty" class="form-select">
                <option>Easy</option><option>Moderate</option><option>Hard</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Duration (days)</label>
            <input type="number" name="duration" min="1" class="form-control" value="1" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" name="slots" min="1" class="form-control" value="10" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date" class="form-control" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date" class="form-control" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Price (₹)</label>
            <input type="number" step="0.01" name="price" class="form-control" value="0">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Assign Staff (optional)</label>
        <select name="staff_id" class="form-select">
            <option value="">-- Unassigned (Pending) --</option>
            {% for s in staff_list %}
            <option value="{{ s.id }}">{{ s.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-trek">Save Trek</button>
    <a href="{{ url_for('admin.treks') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
