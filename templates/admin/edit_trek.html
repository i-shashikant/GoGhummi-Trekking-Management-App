{% extends "layouts/dashboard.html" %}
{% import "admin/_nav.html" as nav %}
{% block title %}Edit Trek | TrekManager{% endblock %}
{% block sidebar %}{{ nav.admin_sidebar() }}{% endblock %}
{% block content %}


<h2 class="mb-4"><i class="fa-solid text-primary fa-pen"></i> Edit Trek: {{ trek.trek_name }}</h2>


<div class="card card-trek p-4">
<form method="POST">

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" name="trek_name" class="form-control" value="{{ trek.trek_name }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
        </div>
    </div>

    <div class="row">
        
        <div class="col-md-3 mb-3">
            <label class="form-label">Difficulty</label>
            <select name="difficulty" class="form-select">
                {% for d in ['Easy','Moderate','Hard'] %}
                <option {% if trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">Duration (days)</label>
            <input type="number" name="duration" min="1" class="form-control" value="{{ trek.duration }}" required>
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" name="available_slots" min="0" class="form-control" value="{{ trek.available_slots }}" readonly>
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">Max Slots</label>
            <input type="number" name="max_slots" min="1" class="form-control" value="{{ trek.max_slots }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date" class="form-control" value="{{ trek.start_date }}" min="{{ today }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date" class="form-control" value="{{ trek.end_date }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Price (₹)</label>
            <input type="number" min="0" name="price" class="form-control" value="{{ trek.price }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                {% for s in ['Pending','Approved','Open','Closed','Completed'] %}
                <option {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Assigned Staff</label>
            <select name="assigned_staff_id" class="form-select">
                <option value="">-- Unassigned --</option>
                {% for s in staff_list %}
                <option value="{{ s.id }}" {% if trek.assigned_staff_id == s.id %}selected{% endif %}>{{ s.username }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3">{{ trek.description }}</textarea>
    </div>

    <button type="submit" class="btn btn-success">Update Trek</button>
    <a href="{{ url_for('admin.treks') }}" class="btn btn-outline-danger">Cancel</a>

</form>
</div>
{% endblock %}
