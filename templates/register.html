{% extends "base.html" %}
{% block title %}Sign Up | TrekManager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-trek p-4">
            <h3 class="text-center mb-4"><i class="fa-solid fa-user-plus"></i> Create Account</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <!-- <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control">
                    </div> -->
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <!-- <div class="col-md-6 mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div> -->
                </div>
                <div class="mb-3">
                    <label class="form-label">Register As</label>
                    <select name="role" class="form-select">
                        <option value="user">Trekker (User)</option>
                        <option value="staff">Trek Staff</option>
                    </select>
                    <small class="text-muted">Trek Staff accounts require admin approval before login.</small>
                </div>
                <button type="submit" class="btn btn-trek w-100">Sign Up</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
