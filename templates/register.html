{% extends "base.html" %}
{% block title %}Sign Up | TrekManager{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container min-vh-100 d-flex align-items-center">

        <div class="row w-100 align-items-center">

            <!-- Left Branding -->
            <div class="col-lg-6 text-center text-white mb-5 mb-lg-0">
                <i class="fa-solid fa-mountain fa-5x mb-4 text-success"></i>
                <h1 class="fw-bold display-4">TrekManager</h1>
                <p class="lead">Plan. Explore. Conquer.</p>
            </div>

            <!-- Right Form -->
            <div class="col-lg-6 d-flex justify-content-center">

                <div class="card card-trek shadow-lg border-0 rounded-4 p-4" style="max-width:450px; width:100%;">

                    <h3 class="text-center mb-4">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </h3>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Register As</label>
                            <select name="role" class="form-select">
                                <option value="user">Trekker (User)</option>
                                <option value="staff">Trek Staff</option>
                            </select>

                            <small class="text-muted">
                                Trek Staff accounts require admin approval before login.
                            </small>
                        </div>

                        <button type="submit" class="btn btn-trek w-100">
                            <i class="fa-solid fa-user-plus me-2"></i>
                            Sign Up
                        </button>

                    </form>

                    <p class="text-center mt-3 mb-2">
                        Already have an account?
                        <a href="{{ url_for('auth.login') }}">Login here</a>
                    </p>

                    <a href="{{ url_for('auth.index') }}"
                       class="btn btn-outline-secondary w-100">
                        <i class="fa-solid fa-house"></i>
                        Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>
</div>
{% endblock %}
