{% extends "base.html" %}

{% block title %}
My Bookings
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">
        My Bookings
    </h2>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>Trek</th>

                <th>Location</th>

                <th>Booking Date</th>

                <th>Status</th>

            </tr>

        </thead>

        <tbody>

        {% for booking in bookings %}

            <tr>

                <td>{{ booking[1] }}</td>

                <td>{{ booking[2] }}</td>

                <td>{{ booking[3] }}</td>

                <td>{{ booking[4] }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
