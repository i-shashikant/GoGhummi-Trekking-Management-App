{% extends "base.html" %}

{% block title %}
Participants
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Trek Participants
    </h2>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Email</th>
        
            </tr>
        </thead>

        <tbody>

        {% for user in participants %}

            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
